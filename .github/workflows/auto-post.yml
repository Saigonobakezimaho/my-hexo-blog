name: 每日自动发文

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成文章
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_HOST: https://api.chatanywhere.tech/v1/chat/completions
          AI_MODEL: gpt-4o-mini
          POSTS_PER_RUN: '2'
        run: node tools/auto-post.js

      - name: 提交并推送
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add source/_posts
          if git diff --cached --quiet; then
            echo "没有新文章，跳过提交"
            exit 0
          fi
          git commit -m "自动发布：$(date -u -d '+8 hours' +%Y-%m-%d) 技术笔记"
          git push
